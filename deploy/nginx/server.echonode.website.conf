# Host Nginx reverse proxy for the IoT platform.
# Install as /etc/nginx/sites-available/mqtt-iot-edge-cloud.
# Adjust ssl_certificate paths if the host stores the certificate elsewhere.

server {
    listen 80;
    listen [::]:80;
    server_name server.echonode.website;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name server.echonode.website;

    ssl_certificate     /etc/letsencrypt/live/server.echonode.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.echonode.website/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MQTTIOTSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 220m;
    client_body_timeout 180s;

    # Django dashboard, admin, REST API and protected media.
    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_request_buffering off;
    }

    # Streamlit operator console; its baseUrlPath is set to /ops.
    location = /ops {
        return 301 /ops/;
    }

    location /ops/ {
        proxy_pass http://127.0.0.1:18501;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Mosquitto MQTT over secure WebSockets.
    location /mqtt {
        proxy_pass http://127.0.0.1:19001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MediaMTX WHEP. Strip /webrtc before forwarding to its HTTP listener.
    location /webrtc/ {
        proxy_pass http://127.0.0.1:18889/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    # MediaMTX HLS. Strip /streams before forwarding.
    location /streams/ {
        proxy_pass http://127.0.0.1:18888/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
