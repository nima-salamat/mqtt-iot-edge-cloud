# The broker is intentionally reachable only inside the Docker network.
# Caddy exposes the WebSocket listener through HTTPS at /mqtt.
per_listener_settings true
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false
password_file /mosquitto/data/password_file
acl_file /mosquitto/config/aclfile

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
