services:
  broker:
    image: eclipse-mosquitto:2.1.2
    container_name: mqtt-iot-broker
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    environment:
      MQTT_DEVICE_USERNAME: ${MQTT_DEVICE_USERNAME:?Set MQTT_DEVICE_USERNAME in .env}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:?Set MQTT_DEVICE_PASSWORD in .env}
      MQTT_SERVER_USERNAME: ${MQTT_SERVER_USERNAME:?Set MQTT_SERVER_USERNAME in .env}
      MQTT_SERVER_PASSWORD: ${MQTT_SERVER_PASSWORD:?Set MQTT_SERVER_PASSWORD in .env}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - mosquitto_data:/mosquitto/data
    expose:
      - "9001"
    networks: [mqtt-internal]

  web:
    build: .
    container_name: mqtt-iot-web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo &&
             python manage.py collectstatic --noinput &&
             gunicorn iotlab.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-server.echonode.website,localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://server.echonode.website}
      DATABASE_PATH: /app/data/db.sqlite3
      MQTT_HOST: broker
      MQTT_PORT: "9001"
      MQTT_WS_PATH: ${MQTT_WS_PATH:-/mqtt}
      MQTT_TLS: "0"
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-iotlab}
      MQTT_USERNAME: ${MQTT_SERVER_USERNAME:?Set MQTT_SERVER_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_SERVER_PASSWORD:?Set MQTT_SERVER_PASSWORD in .env}
    volumes:
      - django_data:/app/data
      - static_data:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      broker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [mqtt-internal]

  listener:
    build: .
    container_name: mqtt-iot-listener
    restart: unless-stopped
    command: ["python", "manage.py", "mqtt_listener"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-server.echonode.website,localhost,127.0.0.1}
      DATABASE_PATH: /app/data/db.sqlite3
      MQTT_HOST: broker
      MQTT_PORT: "9001"
      MQTT_WS_PATH: ${MQTT_WS_PATH:-/mqtt}
      MQTT_TLS: "0"
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-iotlab}
      MQTT_USERNAME: ${MQTT_SERVER_USERNAME:?Set MQTT_SERVER_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_SERVER_PASSWORD:?Set MQTT_SERVER_PASSWORD in .env}
    volumes:
      - django_data:/app/data
    depends_on:
      broker:
        condition: service_started
      web:
        condition: service_healthy
    networks: [mqtt-internal]

  caddy:
    profiles: ["standalone"]
    image: caddy:2.11.9-alpine
    container_name: mqtt-iot-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-server.echonode.website}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      broker:
        condition: service_started
    networks: [mqtt-internal]

volumes:
  django_data:
  mosquitto_data:
  static_data:
  caddy_data:
  caddy_config:

networks:
  mqtt-internal:
    driver: bridge
