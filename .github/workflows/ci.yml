name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q dashboard iotlab server_panel pi_device streamlit_app.py manage.py
      - name: Django system checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py check
      - name: Check model migrations
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django tests
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py test --verbosity 2
