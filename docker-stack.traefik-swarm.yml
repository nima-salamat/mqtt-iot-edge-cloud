version: "3.8"

services:
  broker:
    image: eclipse-mosquitto:2.1.2
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ${PROJECT_DIR}/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${PROJECT_DIR}/mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - mqtt-internal
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.mqtt-iot-edge-cloud == true
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK}"
        - "traefik.http.routers.mqtt-iot-ws.rule=Host(`${DOMAIN}`) && PathPrefix(`/mqtt`)"
        - "traefik.http.routers.mqtt-iot-ws.entrypoints=${TRAEFIK_ENTRYPOINT}"
        - "traefik.http.routers.mqtt-iot-ws.priority=100"
        - "traefik.http.routers.mqtt-iot-ws.tls=true"
        - "traefik.http.routers.mqtt-iot-ws.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
        - "traefik.http.routers.mqtt-iot-ws.service=mqtt-iot-ws"
        - "traefik.http.services.mqtt-iot-ws.loadbalancer.server.port=9001"

  # Streamlit is the public control panel. Django remains the data model/migration layer.
  web:
    image: ${MQTT_IOT_IMAGE}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo &&
             streamlit run streamlit_app.py
             --server.address=0.0.0.0
             --server.port=8501
             --server.headless=true"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_PATH: /app/data/db.sqlite3
      DOMAIN: ${DOMAIN}
      PANEL_USERNAME: ${PANEL_USERNAME}
      PANEL_PASSWORD: ${PANEL_PASSWORD}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-iotlab}
      MQTT_WS_PATH: ${MQTT_WS_PATH:-/mqtt}
      MQTT_BROKER_HOST: ${STACK_NAME}_broker
      MQTT_BROKER_PORT: "1883"
      MQTT_SERVER_USERNAME: ${MQTT_SERVER_USERNAME}
      MQTT_SERVER_PASSWORD: ${MQTT_SERVER_PASSWORD}
    volumes:
      - django_data:/app/data
    networks:
      - mqtt-internal
      - traefik-public
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.mqtt-iot-edge-cloud == true
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK}"
        - "traefik.http.routers.mqtt-iot-dashboard.rule=Host(`${DOMAIN}`) && !PathPrefix(`/mqtt`)"
        - "traefik.http.routers.mqtt-iot-dashboard.entrypoints=${TRAEFIK_ENTRYPOINT}"
        - "traefik.http.routers.mqtt-iot-dashboard.priority=10"
        - "traefik.http.routers.mqtt-iot-dashboard.tls=true"
        - "traefik.http.routers.mqtt-iot-dashboard.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
        - "traefik.http.routers.mqtt-iot-dashboard.service=mqtt-iot-dashboard"
        - "traefik.http.services.mqtt-iot-dashboard.loadbalancer.server.port=8501"
        - "traefik.http.routers.mqtt-iot-http.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.mqtt-iot-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT}"
        - "traefik.http.routers.mqtt-iot-http.middlewares=mqtt-iot-https-redirect"
        - "traefik.http.routers.mqtt-iot-http.service=mqtt-iot-dashboard"
        - "traefik.http.middlewares.mqtt-iot-https-redirect.redirectscheme.scheme=https"

  listener:
    image: ${MQTT_IOT_IMAGE}
    command: ["python", "manage.py", "mqtt_listener"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_PATH: /app/data/db.sqlite3
      MQTT_HOST: ${STACK_NAME}_broker
      MQTT_PORT: "9001"
      MQTT_WS_PATH: ${MQTT_WS_PATH:-/mqtt}
      MQTT_TLS: "0"
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-iotlab}
      MQTT_USERNAME: ${MQTT_SERVER_USERNAME}
      MQTT_PASSWORD: ${MQTT_SERVER_PASSWORD}
    volumes:
      - django_data:/app/data
    networks:
      - mqtt-internal
    deploy:
      # The deployment script scales this to one after the Streamlit service is healthy.
      replicas: 0
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.mqtt-iot-edge-cloud == true

volumes:
  django_data:
    external: true
    name: ${STACK_NAME}_django_data
  mosquitto_data:
    external: true
    name: ${STACK_NAME}_mosquitto_data

networks:
  mqtt-internal:
    driver: overlay
    attachable: true
  traefik-public:
    external: true
    name: ${TRAEFIK_NETWORK}
