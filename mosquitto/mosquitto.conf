# The broker is private to the Docker network.
# Only the WebSocket listener is routed through the public HTTPS reverse proxy.
per_listener_settings true
sys_interval 1

listener 9001 0.0.0.0
protocol websockets
allow_anonymous false
password_file /mosquitto/data/password_file
acl_file /mosquitto/config/aclfile

# Private TCP listener used by the Streamlit panel and Django listener only.
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/data/password_file
acl_file /mosquitto/config/aclfile

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
