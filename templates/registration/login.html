{% load static %}
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ورود | MQTT Cloud Lab</title><link rel="stylesheet" href="{% static 'dashboard/app.css' %}"></head>
<body class="login-page"><main class="login-card"><div class="login-mark">MQ</div><span class="eyebrow">ECHONODE · MQTT IOT EDGE-CLOUD</span><h1>ورود به داشبورد</h1><p>برای مشاهده پیام‌ها و ارسال فرمان به Raspberry Pi وارد شوید.</p>{% if form.errors %}<div class="form-error">نام کاربری یا گذرواژه صحیح نیست.</div>{% endif %}<form method="post">{% csrf_token %}<label for="id_username">نام کاربری</label><input id="id_username" name="username" autocomplete="username" required autofocus><label for="id_password">گذرواژه</label><input id="id_password" name="password" type="password" autocomplete="current-password" required><input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary" type="submit">ورود به سامانه</button></form></main></body></html>
