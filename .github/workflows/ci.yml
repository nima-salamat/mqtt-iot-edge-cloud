name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q dashboard iotlab server_panel pi_device streamlit_app.py manage.py
      - name: Test Raspberry Pi queues, camera settings and adaptive inference
        run: python -m unittest pi_device.test_uploader pi_device.test_settings_store pi_device.test_inference_pool pi_device.test_system_stats pi_device.test_camera_modes pi_device.test_camera_module -v
      - name: Validate Raspberry Pi browser script
        run: node --check pi_device/static/app.js
      - name: Validate dashboard live alert script
        run: node --check dashboard/static/dashboard/live_alerts.js
      - name: Validate deployment scripts
        run: |
          bash -n scripts/load_compose_env.sh
          bash -n scripts/deploy_compose_nginx.sh
          bash -n scripts/deploy_vps.sh
          bash -n scripts/deploy_vps_swarm.sh
          bash -n scripts/install_pi.sh
          bash -n scripts/create_mqtt_users.sh
          sh -n scripts/create_mqtt_users_swarm.sh
      - name: Validate Compose variants
        env:
          DOMAIN: server.echonode.website
          DOCKER_REGISTRY: mirror.gcr.io
          IMAGE_TAG: ci-test
          MOSQUITTO_IMAGE: mirror.gcr.io/eclipse-mosquitto:2.1.4-alpine
          DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
          DJANGO_ALLOWED_HOSTS: server.echonode.website,localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS: https://server.echonode.website
          MQTT_SERVER_PASSWORD: ci-only-mqtt-server-password
          MQTT_SERVER_USERNAME: django-server
          MQTT_CAMERA_EDGE_USERNAME: camera-edge
          MQTT_CAMERA_EDGE_PASSWORD: ci-only-camera-edge-password
          PANEL_USERNAME: ci-operator
          PANEL_PASSWORD: ci-only-panel-password
          HOST_CERT_DIR: /tmp
          MEDIA_TLS_CERT: /host-certs/test.crt
          MEDIA_TLS_KEY: /host-certs/test.key
        run: |
          DATABASE_MODE=sqlite docker compose -f docker-compose.yml -f docker-compose.nginx.yml -f docker-compose.sqlite.yml config -q
          DATABASE_MODE=postgres POSTGRES_PASSWORD=ci-only-postgres-password docker compose -f docker-compose.yml -f docker-compose.nginx.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.traefik.yml config -q
      - name: Django system checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py check
      - name: Check model migrations
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py makemigrations --check --dry-run
      - name: Collect static assets
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py collectstatic --noinput
      - name: Run Django tests
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py test --verbosity 2
