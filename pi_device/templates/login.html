<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ورود به Raspberry Pi</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head><body class="login-page"><main class="login-card"><div class="brand-mark">Pi</div><span class="eyebrow">LOCAL DEVICE PORTAL</span><h1>ورود به پنل رزبری‌پای</h1><p>این صفحه فقط برای شبکه محلی طراحی شده است.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" action="{{ url_for('login_post') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="password">گذرواژه محلی</label><input id="password" name="password" type="password" required autofocus autocomplete="current-password"><button type="submit">ورود</button></form></main></body></html>
