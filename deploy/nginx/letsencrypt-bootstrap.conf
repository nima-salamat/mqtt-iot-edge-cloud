# Temporary HTTP-only Nginx site used to obtain the initial Let's Encrypt certificate.
# Replace this site with server.echonode.website.conf after Certbot succeeds.

server {
    listen 80;
    listen [::]:80;
    server_name server.echonode.website;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
